spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  data:
    redis:
      host: localhost
      port: 6379
      password:

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: test-client-id
            client-secret: test-client-secret

jwt:
  secret: test-secret-key-for-jwt-testing-12345678901234567890
  access-expiration: 7200000
  refresh-expiration: 2592000000
  issuer: demo

app:
  oauth2:
    redirect-uri: com.example.demo://oauth2/redirect
    web-redirect-uri: http://localhost:8080/api/auth/login/success